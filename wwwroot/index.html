<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#713b24">
  <title>Panificadora do Rafael</title>
  <link rel="stylesheet" href="/estilo.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header><small>OPERAÇÃO COMERCIAL</small><h1>Panificadora do Rafael</h1><p>Pedidos em campo, estoque e recebimentos</p></header>
<main>
  <section>
    <h2>Acesso</h2>
    <form id="acesso">
      <label>Chave da operação <input name="chave" type="password" required autocomplete="current-password"></label>
      <button>Entrar ou atualizar</button>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
  </section>
  <section>
    <h2>Pedidos em campo</h2>
    <p id="catalogo"></p>
    <form id="pedido">
      <label>Cliente <select name="cliente" required></select></label>
      <label>Produto <select name="produto" required></select></label>
      <label>Quantidade <input name="quantidade" type="number" min="1" max="10000" value="1" required></label>
      <button type="button" id="adicionar">Adicionar item</button>
      <ul id="itens"></ul>
      <label>Parcelas <select name="parcelas"><option>1</option><option>2</option><option>3</option></select></label>
      <button>Salvar pedido no aparelho</button>
    </form>
    <h3>Fila de envio</h3>
    <p id="fila"></p>
    <button type="button" id="sincronizar">Transmitir pedidos</button>
  </section>
  <section id="gestao" hidden>
    <h2>Painel de gestão</h2>
    <div class="grade">
      <form data-rota="clientes"><h3>Cliente</h3>
        <label>Nome <input name="nome" required></label>
        <label>Cliente desde <input name="desde" type="date" required></label>
        <button>Cadastrar cliente</button>
      </form>
      <form data-rota="produtos"><h3>Produto</h3>
        <label>Nome <input name="nome" required></label>
        <label>Preço (R$) <input name="preco" type="number" min=".01" max="100000" step=".01" required></label>
        <label>Validade mínima (dias) <input name="validadeMinima" type="number" min="0" max="365" value="0" required></label>
        <button>Cadastrar produto</button>
      </form>
      <form data-rota="lotes"><h3>Lote</h3>
        <label>Produto <select name="produtoId" required></select></label>
        <label>Quantidade <input name="quantidade" type="number" min="1" max="1000000" required></label>
        <label>Vencimento <input name="validade" type="date" required></label>
        <button>Registrar entrada</button>
      </form>
    </div>
    <button id="fechar" type="button" hidden>Fechar pedidos de demonstração</button>
    <div id="operacao"></div>
  </section>
</main>
</body>
</html>
